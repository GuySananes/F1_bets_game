{% extends "base.html" %}
{% block title %}Users — Admin{% endblock %}
{% block content %}
<p><a href="/admin">&larr; Admin</a></p>
<h2>Users</h2>
<table>
  <thead>
    <tr><th>Username</th><th>Admin</th><th></th></tr>
  </thead>
  <tbody>
    {% for user in users %}
    <tr>
      <td>{{ user.username }}</td>
      <td>{{ "Yes" if user.is_admin else "No" }}</td>
      <td>
        <form class="inline" method="post" action="/admin/users/{{ user.id }}/reset-password" onsubmit="return confirm('Reset {{ user.username }}\'s password to \'F1\'?');">
          <button type="submit">Reset password</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
