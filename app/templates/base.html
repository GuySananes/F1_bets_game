<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}F1 Prediction League{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">

  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#e10600">
  <link rel="icon" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="F1 Bets">

  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/static/sw.js"));
    }
  </script>
</head>
<body>
  <header>
    <h1><a href="/">F1 Prediction League</a></h1>
    {% if current_user %}
    <nav>
      <ul>
        <li><a href="/predict">Predictions</a></li>
        <li><a href="/leaderboard">Leaderboard</a></li>
        {% if current_user.is_admin %}<li><a href="/admin">Admin</a></li>{% endif %}
        <li><form class="inline" method="post" action="/auth/logout"><button type="submit">Log out</button></form></li>
      </ul>
    </nav>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
